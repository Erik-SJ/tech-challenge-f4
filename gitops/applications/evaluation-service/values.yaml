namespace: evaluation-service

replicaCount: 1

image:
  repository: 071200285218.dkr.ecr.us-east-1.amazonaws.com/evaluation-service
  tag: "2a6b410"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8004

secret:
  name: evaluation-secret

externalSecret:
  key: evaluation-service  

configMap:
  name: evaluation-config
  data:
    FLAG_SERVICE_URL: "http://flag-service.flag-service.svc.cluster.local"
    TARGETING_SERVICE_URL: "http://targeting-service.targeting-service.svc.cluster.local"
    OTEL_EXPORTER_OTLP_ENDPOINT: "addon-opentelemetry-opentelemetry-collector.observability.svc.cluster.local:4317"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70  
