apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: "{{ .Values.secret.name }}"
  namespace: "{{ .Values.namespace }}"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: "{{ .Values.secret.name }}"
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: "{{ .Values.externalSecret.key }}"