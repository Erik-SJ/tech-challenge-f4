namespace: analytics-service

replicaCount: 1

image:
  repository: 712979978195.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  tag: "373ea4f"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8005

secret:
  name: analytics-secret

externalSecret:
  key: analytics-service  

configMap:
  name: analytics-config
  data:
    AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70