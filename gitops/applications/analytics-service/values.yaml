namespace: analytics-service

replicaCount: 1

image:
  repository: 071200285218.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  tag: "c33d9bc"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8005

secret:
  name: analytics-secret

externalSecret:
  key: analytics-service  

configMap:
  name: analytics-config
  data:
    AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
    OTEL_EXPORTER_OTLP_ENDPOINT: "addon-opentelemetry-opentelemetry-collector.observability.svc.cluster.local:4317"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70