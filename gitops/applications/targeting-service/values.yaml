namespace: targeting-service

replicaCount: 1

image:
  repository: 071200285218.dkr.ecr.us-east-1.amazonaws.com/targeting-service
  tag: "1cca8f0"
  pullPolicy: Always

service:
  port: 80
  targetPort: 8003

secret:
  name: targeting-secret

externalSecret:
  key: targeting-service  

configMap:
  name: targeting-config
  data:
    AUTH_SERVICE_URL: "http://auth-service.auth-service.svc.cluster.local"
    OTEL_EXPORTER_OTLP_ENDPOINT: "addon-opentelemetry-opentelemetry-collector.observability.svc.cluster.local:4317"
    
autoscaling:
  enabled: false  
