apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: "{{ .Values.namespace }}"
  labels:
    app: targeting-service
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
