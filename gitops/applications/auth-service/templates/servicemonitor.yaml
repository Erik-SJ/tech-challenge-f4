apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service
  namespace: observability
  labels:
    release: addon-kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - "{{ .Values.namespace }}"
  selector:
    matchLabels:
      app: auth-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
