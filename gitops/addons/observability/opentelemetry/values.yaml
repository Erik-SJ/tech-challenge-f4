opentelemetry-collector:
  mode: daemonset

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - pods
          - namespaces
          - nodes
        verbs:
          - get
          - list
          - watch

      - apiGroups: ["apps"]
        resources:
          - replicasets
        verbs:
          - get
          - list
          - watch

  image:
    repository: otel/opentelemetry-collector-contrib

  serviceMonitor:
    enabled: true
    extraLabels:
      release: addon-kube-prometheus-stac

  ports:
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers

  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container-parser

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.deployment.name
          labels:
            - tag_name: service_name
              key: app
              from: pod

      batch: {}

    exporters:
      debug:
        verbosity: basic

      otlphttp/loki:
        endpoint: http://addon-loki.observability.svc.cluster.local:3100/otlp

    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug

        logs:
          receivers:
            - otlp
            - filelog
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          exporters:
            - otlphttp/loki
