apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: auth-service-alertmanager
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: default
    groupBy:
      - alertname
      - service
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: default
