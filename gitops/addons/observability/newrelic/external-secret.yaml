apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: newrelic-license
  namespace: observability

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: newrelic-license
    creationPolicy: Owner

  data:
    - secretKey: license-key
      remoteRef:
        key: newrelic-license-key
