apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-alertmanager
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: github-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github-alertmanager-token
    - secretKey: repository
      remoteRef:
        key: github-alertmanager-repo
