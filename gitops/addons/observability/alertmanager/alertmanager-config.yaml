apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: service-alertmanager
  namespace: observability
  labels:
    release: kube-prometheus-stack

spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - service
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 4h

    routes:
      - receiver: discord
        continue: true

      - receiver: github-bridge
        continue: true

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: webhook-url
          sendResolved: true
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [{{ .CommonLabels.service }}] - Alta taxa de erros "HTTP 5xx"'
          message: |
            **Status:** {{ if eq .Status "firing" }}Alerta ativo{{ else }}Alerta resolvido{{ end }}
            **Serviço:** `{{ .CommonLabels.service }}`
            **Severidade:** `{{ .CommonLabels.severity }}`

            {{ if eq .Status "firing" }}**Detalhes:** *A taxa de erros "HTTP 5xx" no {{ .CommonLabels.service }} está elevada, ultrapassando 5% nos últimos 60 segundos.*{{ else }}**Detalhes:** *Esse alerta foi resolvido com a execução do Self-Healing do GitHub Actions.*{{ end }}

            🔎 [Ver no Prometheus](http://localhost:9090/)

    - name: github-bridge
      webhookConfigs:
        - url: http://github-bridge.observability.svc.cluster.local:8080/
          sendResolved: false