apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: service-alertmanager
  namespace: observability
  labels:
    release: kube-prometheus-stack

spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - service
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 4h

    routes:
      - receiver: discord
        continue: true

      - receiver: github-bridge
        continue: true

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: webhook-url
          sendResolved: true

    - name: github-bridge
      webhookConfigs:
        - url: http://github-bridge.observability.svc.cluster.local:8080/
          sendResolved: false