apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jira-alertmanager
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: jira-alertmanager
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: jira-alertmanager
