apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jira-alertmanager
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: jira-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef:
        key: jira-alertmanager
        property: email
    - secretKey: token
      remoteRef:
        key: jira-alertmanager
        property: token
