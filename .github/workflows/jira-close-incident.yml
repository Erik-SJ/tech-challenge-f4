name: "[Alert]: Close Incident"

on:
  repository_dispatch:
    types: [alert-close-incident]

jobs:
  close-jira-incident:
    runs-on: ubuntu-latest

    steps:
      - name: Wait 30 seconds
        run: |
          echo "Aguardando 30 segundos antes de fechar o incidente..."
          sleep 30
          echo "Tempo de espera concluído."

      - name: Close Jira incident
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          ISSUE_KEY: ${{ github.event.client_payload.issue_key }}
          SELF_HEALING_URL: ${{ github.event.client_payload.self_healing_url }}

        run: |
          echo "Encerrando incidente $ISSUE_KEY..."

          curl --fail --silent --show-error \
            --request POST \
            --url "$JIRA_URL/rest/api/3/issue/$ISSUE_KEY/transitions" \
            --user "$JIRA_EMAIL:$JIRA_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "transition": {
                "id": "61"
              },
              "fields": {
                "resolution": {
                  "id": "10000"
                }
              }
            }'

          curl --fail --silent --show-error \
            --request POST \
            --url "$JIRA_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --user "$JIRA_EMAIL:$JIRA_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{
              \"body\": {
                \"type\": \"doc\",
                \"version\": 1,
                \"content\": [
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      {
                        \"type\": \"text\",
                        \"text\": \"Incidente encerrado após a execução bem-sucedida do self-healing e normalização do serviço.\"
                      }
                    ]
                  },
                  {
                    \"type\": \"paragraph\",
                    \"content\": [
                      {
                        \"type\": \"text\",
                        \"text\": \"Execução do self-healing: $SELF_HEALING_URL\"
                      }
                    ]
                  }
                ]
              }
            }"

          echo "Incidente $ISSUE_KEY encerrado com sucesso."