name: Self-Healing

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - alertmanager-self-healing

jobs:
  self-healing:
    name: Self-Healing
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: eks-fiap-f4-lab
      NAMESPACE: flag-service
      DEPLOYMENT: flag-service

    steps:
      - name: Show alert information
        run: |
          echo "Alert: ${{ github.event.client_payload.alertname }}"
          echo "Service: ${{ github.event.client_payload.service }}"
          echo "Description: ${{ github.event.client_payload.description }}"  
          echo "Jira Incident: ${{ github.event.client_payload.issue_key }}"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Check Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get pods -n "$NAMESPACE"

      - name: Restart flag-service
        run: |
          echo "Iniciando Self-Healing..."
          echo "Deployment: $DEPLOYMENT"
          echo "Namespace: $NAMESPACE"

          kubectl rollout restart \
            deployment/"$DEPLOYMENT" \
            -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/"$DEPLOYMENT" \
            -n "$NAMESPACE" \
            --timeout=5m

      - name: Validate deployment
        run: |
          echo "Pods após o Self-Healing:"
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

          echo ""
          echo "Deployment:"
          kubectl get deployment "$DEPLOYMENT" \
            -n "$NAMESPACE"

          echo ""
          echo "Self-Healing concluído com sucesso."

      - name: Debug repository dispatch
        run: |
          echo '${{ toJson(github.event.client_payload) }}'    

      - name: Trigger Jira Close Incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key || '' }}"
          SELF_HEALING_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$ISSUE_KEY" ]; then
            echo "ISSUE_KEY não informado."
            exit 1
          fi

          echo "Solicitando encerramento do Jira $ISSUE_KEY..."

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{
              \"event_type\": \"jira-close-incident\",
              \"client_payload\": {
                \"issue_key\": \"$ISSUE_KEY\",
                \"self_healing_url\": \"$SELF_HEALING_URL\"
              }
            }"

          echo "Solicitação de encerramento enviada para $ISSUE_KEY."    