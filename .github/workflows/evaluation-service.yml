name: "[CI] Evaluation Service"

permissions:
  contents: write

concurrency:
  group: helm-values-update
  queue: max
  cancel-in-progress: false   

on:
  push:
    branches: [main]
    paths:
      - "apps/evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
env:
  SERVICE_NAME: evaluation-service
  SERVICE_PATH: apps/evaluation-service
  AWS_REGION: us-east-1

jobs:
  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
           go-version: "1.25"

      - name: Download dependencies    
        run: go mod download
 
      - name: Verify compilation  
        run: go build ./...
 
      - name: Run unit tests
        run: go test ./...

  code-quality:
    name: Code Quality
    needs: code-validation
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
  
      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: ${{ env.SERVICE_PATH }}       

  security-analysis:
    name: Security Analysis
    needs: code-validation
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Run SAST - Gosec
        uses: securego/gosec@master
        with:
          args: ./${{ env.SERVICE_PATH }}/...
  
      - name: Run SCA - Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_PATH }}
          severity: CRITICAL
          exit-code: "1"

  build-and-push:
    name: Docker Build, Scan and Push
    needs:
      - code-quality
      - security-analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
  
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
  
      - name: Build Docker image
        run: |
          docker build \
            -t $SERVICE_NAME:$IMAGE_TAG \
            $SERVICE_PATH
  
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: "1"
  
      - name: Tag Docker image
        run: |
          docker tag \
          $SERVICE_NAME:$IMAGE_TAG \
          ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:$IMAGE_TAG
  
      - name: Push Docker image to ECR
        run: |
          docker push \
          ${{ secrets.ECR_REGISTRY }}/$SERVICE_NAME:$IMAGE_TAG

  update-helm-values:
    name: Update Helm Values
    needs:
      - build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          sed -i "s/^  tag:.*/  tag: \"${IMAGE_TAG}\"/" \
          gitops/applications/${SERVICE_NAME}/values.yaml

      - name: Commit Helm values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/applications/${SERVICE_NAME}/values.yaml

          git diff --cached --quiet || \
          git commit -m "ci(${SERVICE_NAME}): update image tag to ${IMAGE_TAG}"

      - name: Sync with remote branch
        run: |
          git pull --rebase origin main

      - name: Push changes
        run: |
          git push origin main

      - name: Deployment information
        run: |
          echo "Helm values updated successfully."
          echo "ArgoCD will automatically synchronize the application."